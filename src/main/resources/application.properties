spring.application.name=SideProject01Bissol
server.port=9000

# --- Oracle ---
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:XE
spring.datasource.username=BISSOL
spring.datasource.password=1234
# --- H2 (in-memory, 테스트용) ---
#spring.datasource.url=jdbc:h2:mem:weatherdb;DB_CLOSE_DELAY=-1
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=
#spring.h2.console.enabled=true

# --- JPA ---
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# --- OpenWeather (환경변수에서 주입) ---
weather.api.base-url=https://api.openweathermap.org/data/2.5
weather.api.key=${WEATHER_API_KEY}
weather.api.units=metric
weather.api.lang=kr

# --- Swagger ---
# --- Jackson ---
spring.jackson.time-zone=Asia/Seoul




